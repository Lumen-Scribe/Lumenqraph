name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'migrations/**'
      - 'explorer/**'
      - 'scripts/run-all-in-one.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'migrations/**'
      - 'explorer/**'
      - 'scripts/run-all-in-one.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: lumenqraph

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Postgres for the explorer smoke test below: the API will not start
    # without a database at the current schema (#473).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        run: |
          CHANNEL=$(grep -m1 'channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$CHANNEL" ]; then
            echo "ERROR: could not extract channel from rust-toolchain.toml"
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "rust-toolchain.toml channel: $CHANNEL"

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert builder rustc matches rust-toolchain.toml
        run: |
          EXPECTED="${{ steps.toolchain.outputs.channel }}"
          if [ -z "$EXPECTED" ]; then
            echo "ERROR: expected toolchain channel is empty"
            exit 1
          fi
          ACTUAL=$(docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:test /rustc-version.txt)
          echo "rust-toolchain.toml channel: $EXPECTED"
          echo "builder rustc: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "$EXPECTED"; then
            echo "ERROR: builder rustc ($ACTUAL) does not match rust-toolchain.toml ($EXPECTED)"
            exit 1
          fi
          echo "✓ Builder rustc matches rust-toolchain.toml"

      - name: Smoke test - lumenqraph-api help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-api --help

      - name: Smoke test - lumenqraph-indexer help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-indexer --help

      - name: Smoke test - lumenqraph-webhooks help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-webhooks --help

      - name: Smoke test - lumenqraph-mcp help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-mcp --help

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm ${{ env.IMAGE_NAME }}:test whoami)
          echo "Container runs as user: $USER"
          if [ "$USER" != "lumenqraph" ]; then
            echo "ERROR: Container should run as 'lumenqraph' user, not '$USER'"
            exit 1
          fi
          echo "✓ Container runs as non-root user 'lumenqraph'"

      # Issue #635: the image must serve a working explorer. Loads `/` and
      # `/app.js`, which the page's <script src="app.js"> needs under the CSP.
      - name: Smoke test - explorer UI and app.js are served
        env:
          DATABASE_URL: postgres://lumenqraph:lumenqraph@127.0.0.1:5432/lumenqraph
          WEBHOOK_ENCRYPTION_KEY: ci-smoke-test-key-not-for-production
        run: |
          set -euo pipefail
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" \
            "${IMAGE_NAME}:test" lumenqraph-indexer migrate
          docker run -d --name explorer-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e WEBHOOK_ENCRYPTION_KEY="$WEBHOOK_ENCRYPTION_KEY" \
            -e API_BIND_ADDR=127.0.0.1:8080 \
            "${IMAGE_NAME}:test" lumenqraph-api
          ready=false
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/livez >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "::error::API did not become live"
            docker logs explorer-smoke || true
            exit 1
          fi
          page=$(mktemp)
          curl -sf http://127.0.0.1:8080/ -o "$page"
          grep -q "<title>Lumenqraph Explorer</title>" "$page"
          script=$(mktemp)
          headers=$(curl -sf -D - -o "$script" http://127.0.0.1:8080/app.js)
          printf '%s\n' "$headers" | grep -qi '^content-type: *text/javascript\|^content-type: *application/javascript'
          test -s "$script"
          echo "✓ explorer page and app.js are served"
