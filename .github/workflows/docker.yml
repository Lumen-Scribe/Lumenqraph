name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'migrations/**'
      - 'explorer/**'
      - 'scripts/run-all-in-one.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'migrations/**'
      - 'explorer/**'
      - 'scripts/run-all-in-one.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  IMAGE_NAME: lumenqraph

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
            RUST_VERSION=${{ steps.toolchain.outputs.channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert builder rustc matches rust-toolchain.toml
        run: |
          EXPECTED="${{ steps.toolchain.outputs.channel }}"
          ACTUAL=$(docker run --rm --entrypoint rustc ${{ env.IMAGE_NAME }}:test --version)
          echo "rust-toolchain.toml channel: $EXPECTED"
          echo "builder rustc: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "$EXPECTED"; then
            echo "ERROR: builder rustc ($ACTUAL) does not match rust-toolchain.toml ($EXPECTED)"
            exit 1
          fi
          echo "✓ Builder rustc matches rust-toolchain.toml"

      - name: Smoke test - lumenqraph-api help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-api --help

      - name: Smoke test - lumenqraph-indexer help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-indexer --help

      - name: Smoke test - lumenqraph-webhooks help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-webhooks --help

      - name: Smoke test - lumenqraph-mcp help
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:test lumenqraph-mcp --help

      - name: Verify non-root user
        run: |
          USER=$(docker run --rm ${{ env.IMAGE_NAME }}:test whoami)
          echo "Container runs as user: $USER"
          if [ "$USER" != "lumenqraph" ]; then
            echo "ERROR: Container should run as 'lumenqraph' user, not '$USER'"
            exit 1
          fi
          echo "✓ Container runs as non-root user 'lumenqraph'"
