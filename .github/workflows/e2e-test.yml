name: End-to-End Test

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-test:
    name: Full Stack E2E Test
    runs-on: ubuntu-latest
    # A cold `docker compose up --build` compiles the whole workspace in
    # release mode (no layer cache on a fresh runner), which alone takes
    # longer than the old 15-minute budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # #488: the previous pin (885d146…, "v3") does not exist upstream, so the
      # job failed at "Set up job" on every run. Use the same verified v4 pin
      # as docker.yml and docker-publish.yml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a0c4c1e0e0e0e0e0e0e0e0e0e0e0e0e0 # v3

      - name: Generate webhook encryption key and Postgres password
        run: |
          echo "WEBHOOK_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> $GITHUB_ENV
          # docker-compose.full.yml requires an operator-supplied password.
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV

      - name: Check testnet reachability
        id: testnet
        run: |
          if curl -sf --max-time 10 https://soroban-testnet.stellar.org/health > /dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "Testnet is reachable."
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "::warning::Testnet RPC is unreachable; failures will be classified as external."
          fi

      - name: Start full stack with docker-compose
        id: build
        run: |
          docker compose -f docker-compose.full.yml up --build -d
        env:
          WEBHOOK_ENCRYPTION_KEY: ${{ env.WEBHOOK_ENCRYPTION_KEY }}
          RPC_URL: https://soroban-testnet.stellar.org
          RUST_LOG: info

      - name: Wait for services to be ready
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          until curl -sf --max-time 5 http://localhost:8080/readyz > /dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API did not become ready within 10 minutes"
              curl -sS --max-time 5 http://localhost:8080/readyz || true
              exit 1
            fi
            echo "Waiting for API /readyz... (${SECONDS}s elapsed)"
            sleep 5
          done
          echo "API is ready."

      - name: Check service status
        run: |
          docker compose -f docker-compose.full.yml ps
          docker compose -f docker-compose.full.yml logs --tail=50 api || true

      - name: Run smoke test
        id: smoke
        run: bash scripts/e2e_smoke_test.sh
        env:
          API_URL: http://localhost:8080

      - name: Assert indexed data is served by the API
        id: api
        run: |
          set -euo pipefail
          api=http://localhost:8080

          initial=$(curl -sf --max-time 10 "$api/health" | jq -r '.last_processed_ledger // 0')
          echo "Initial last_processed_ledger: $initial"

          deadline=$((SECONDS + 600))
          current=$initial
          until [ "$current" -gt "$initial" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::last_processed_ledger did not advance past $initial within 10 minutes"
              exit 1
            fi
            sleep 5
            current=$(curl -sf --max-time 10 "$api/health" | jq -r '.last_processed_ledger // 0')
            echo "last_processed_ledger: $current"
          done

          contracts=$(curl -sf --max-time 10 "$api/contracts")
          count=$(echo "$contracts" | jq 'if type == "array" then length else (.contracts // .data // []) | length end')
          echo "Indexed contracts: $count"
          if [ "$count" -lt 1 ]; then
            echo "::error::/contracts returned no indexed contracts"
            exit 1
          fi

          contract_id=$(echo "$contracts" | jq -r 'if type == "array" then .[0].contract_id // .[0].id else (.contracts // .data // [])[0].contract_id // (.contracts // .data // [])[0].id end')
          echo "Probing events for contract: $contract_id"

          status=$(curl -s -o /tmp/events.json -w '%{http_code}' --max-time 10 \
            "$api/contracts/$contract_id/events?limit=1")
          echo "HTTP status: $status"
          cat /tmp/events.json
          if [ "$status" != "200" ]; then
            echo "::error::/contracts/$contract_id/events?limit=1 returned HTTP $status"
            exit 1
          fi

          rows=$(jq 'if type == "array" then length else (.events // .data // .edges // []) | length end' /tmp/events.json)
          echo "Event rows returned: $rows"
          if [ "$rows" -lt 1 ]; then
            echo "::error::/contracts/$contract_id/events?limit=1 returned no events"
            exit 1
          fi

      - name: Classify failure
        if: failure()
        id: classify
        run: |
          if [ "${{ steps.testnet.outputs.reachable }}" = "false" ]; then
            echo "classification=external" >> $GITHUB_OUTPUT
            echo "::warning::E2E failure classified as EXTERNAL (testnet unreachable)."
          else
            echo "classification=pipeline" >> $GITHUB_OUTPUT
            echo "::error::E2E failure classified as PIPELINE (our services are broken)."
          fi

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## E2E Test Summary"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Testnet reachability | ${{ steps.testnet.outputs.reachable == 'true' && 'ok' || 'unreachable' }} |"
            echo "| Build / start stack | ${{ steps.build.outcome || 'skipped' }} |"
            echo "| Smoke test (migrate/index) | ${{ steps.smoke.outcome || 'skipped' }} |"
            echo "| API assertion | ${{ steps.api.outcome || 'skipped' }} |"
            echo ""
            if [ "${{ steps.classify.outputs.classification }}" = "external" ]; then
              echo "**Classification:** external (testnet unreachable)"
            elif [ "${{ steps.classify.outputs.classification }}" = "pipeline" ]; then
              echo "**Classification:** pipeline (our services are broken)"
            else
              echo "**Classification:** none (run succeeded)"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== API logs ==="
          docker compose -f docker-compose.full.yml logs api || true
          echo "=== Indexer logs ==="
          docker compose -f docker-compose.full.yml logs indexer || true
          echo "=== Webhooks logs ==="
          docker compose -f docker-compose.full.yml logs webhooks || true

      - name: Clean up
        if: always()
        run: docker compose -f docker-compose.full.yml down -v

  notify-failure:
    name: Open tracking issue on scheduled failure
    needs: e2e-test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = 'Scheduled E2E test failing on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled End-to-End Test workflow failed on `main`.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              '',
              'See the workflow summary for the failing stage (build, migrate, index, API assertion) and the failure classification (external vs pipeline).',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'e2e-failure',
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['e2e-failure'],
              });
            }
