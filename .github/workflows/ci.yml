name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Issue #361: sqlx keys migrations by integer version and
  # `_sqlx_migrations.version` is the primary key, so two files sharing a
  # numeric prefix cannot both be recorded. Fail fast if any duplicate
  # version prefix exists in migrations/.
  migration-versions:
    name: Migration Version Uniqueness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject duplicate migration version prefixes
        run: |
          dups=$(ls migrations | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate migration version prefixes found:"
            echo "$dups"
            exit 1
          fi

  # Issue #475: lint new or changed migrations with squawk so table-locking
  # DDL (non-concurrent index builds, constraints without NOT VALID, column
  # rewrites, …) can't reach `main` unreviewed. Intentional cases opt out with
  # a `-- squawk-ignore <rule>` comment. See docs/MIGRATIONS.md.
  migration-lint:
    name: Migration Lock-Safety Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      SQUAWK_VERSION: "2.67.0"
      SQUAWK_SHA256: "03efe0e666b63bf33e2493693ee0aa9dbed07cbdcd20f7a8292245c1da9d790a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install squawk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/squawk" \
            "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          echo "${SQUAWK_SHA256}  $RUNNER_TEMP/squawk" | sha256sum --check
          chmod +x "$RUNNER_TEMP/squawk"
          "$RUNNER_TEMP/squawk" --version
      - name: Lint changed migrations
        env:
          SQUAWK: ${{ runner.temp }}/squawk
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE_SHA"
          else
            base="HEAD~1"
          fi
          bash scripts/lint_migrations.sh "$base"

  # Verify MSRV declared in Cargo.toml
  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv
      # Issue #523: fail fast with a clear message when the workspace
      # manifest itself is broken, before any compilation starts.
      - name: Validate workspace manifest
        run: cargo metadata --format-version 1 >/dev/null
      - name: Build on MSRV
        run: cargo build --workspace --all-targets
      - name: Check on MSRV
        run: cargo check --workspace --all-targets

  # Issue #355: the Docker builder must compile with the same Rust version
  # declared in rust-toolchain.toml, otherwise release images can be built with
  # a different compiler than CI.  Build the image and assert the rustc version
  # baked into it matches the pinned toolchain.
  docker-toolchain-check:
    name: Docker Toolchain Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          CHANNEL=$(grep -m1 'channel' rust-toolchain.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: docker build -t lumenqraph-api:ci .
      - name: Assert image rustc matches rust-toolchain.toml
        run: |
          IMAGE_RUSTC=$(docker run --rm lumenqraph-api:ci rustc --version)
          echo "image rustc: $IMAGE_RUSTC"
          echo "pinned channel: ${{ steps.toolchain.outputs.channel }}"
          echo "$IMAGE_RUSTC" | grep -q "${{ steps.toolchain.outputs.channel }}"

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
      # Read by the #[ignore]-marked tests to reach the service container; they
      # are run explicitly in the `--ignored` step below.
      TEST_DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check sensitive logging
        run: python3 scripts/check_sensitive_logging.py
      - name: Check .env.example covers every env var
        run: python3 scripts/check_env_example.py
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Check sqlx metadata is up-to-date
        run: cargo sqlx prepare --database-url "$DATABASE_URL" --check
      - name: Test
        run: cargo test --workspace
      # The tests above skip anything marked #[ignore], which is every test that
      # needs a real database — retention pruning, contract-spec versioning, and
      # webhook enqueue all live there. Run them explicitly against the service
      # container above.
      #
      # Each test now provisions its own isolated Postgres schema (unique UUID
      # name), so they are safe to run in parallel and cannot corrupt each other
      # or any existing database.
      - name: Test (Postgres-backed)
        run: |
          cargo test -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo test -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo test -p lumenqraph-api      -- --ignored --test-threads=1
          cargo test -p lumenqraph-mcp      -- --ignored --test-threads=1
      # The end-to-end smoke test is gated behind the `smoke-tests` feature so it
      # never compiles into a plain `cargo test`. It uses a mock RPC (no live
      # network); run it explicitly here where Postgres is available.
      - name: Test (smoke, end-to-end)
        run: cargo test -p lumenqraph-indexer --features smoke-tests smoke -- --ignored --test-threads=1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-api      -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-mcp      -- --ignored --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Build (release)
        run: cargo build --workspace --release

  # Issue #222: OpenAPI spec drift check.
  # Generates the spec from utoipa annotations (via --print-openapi) and
  # compares it against the committed openapi.yaml.  Fails the build if any
  # path, method, or parameter name differs so that hand-edits to the YAML
  # can never silently diverge from the actual implementation.
  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: openapi-drift
      - name: Build lumenqraph-api
        run: cargo build -p lumenqraph-api
      - name: Generate OpenAPI spec from code
        # --print-openapi dumps the utoipa-derived spec as JSON and exits
        # without connecting to Postgres or binding a port.
        run: cargo run -p lumenqraph-api -- --print-openapi > /tmp/generated-openapi.json
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check for drift
        run: |
          python3 scripts/check_openapi_drift.py openapi.yaml /tmp/generated-openapi.json

  # Issue #357: build and validate the Python SDK so it stays installable.
  # `python -m build` produces an sdist and a wheel from sdk/python, and
  # `twine check` verifies the package metadata (including the LICENSE file
  # referenced by pyproject.toml) is valid for upload.
  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        working-directory: sdk/python
        run: pip install -e ".[dev]"
      - name: Type-check (mypy)
        working-directory: sdk/python
        run: mypy lumenqraph
      - name: Lint (ruff)
        working-directory: sdk/python
        run: ruff check lumenqraph
      - name: Test
        working-directory: sdk/python
        run: pytest -v
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheel
        working-directory: sdk/python
        run: python -m build
      - name: Check package metadata
        working-directory: sdk/python
        run: twine check dist/*

  # Issue #467: lumenqraph/models.py is generated from openapi.yaml; fail if
  # the committed module is stale (the Python counterpart of the TypeScript
  # SDK's `codegen:check`).
  python-sdk-codegen:
    name: Python SDK models drift check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install code generator
        run: pip install -e ".[codegen]"
      - name: Check models.py against openapi.yaml
        run: python scripts/codegen.py --check

  # Issue #470: docs and compose must agree on the service count. The MCP
  # server made it four binaries; catch stale "three services" wording.
  docs-service-count:
    name: Docs service-count check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject stale "three services" wording
        run: |
          if grep -rniE "(all )?three (service )?(binaries|services)" \
               README.md docs/ARCHITECTURE.md docs/DEPLOYMENT.md Dockerfile docker-compose.full.yml; then
            echo "::error::Docs mention three services; there are four (indexer, api, webhooks, mcp)."
            exit 1
          fi

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Issue #530: actionlint does not verify that a pinned SHA actually exists.
  # Resolve every `uses: owner/repo@sha` reference through the GitHub API and
  # fail on a 404 so a bad pin (e.g. a typo'd or deleted commit) fails the PR
  # instead of breaking the nightly E2E run.
  action-sha-resolution:
    name: Action SHA Resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve every pinned action SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=0
          # Extract owner/repo@sha from every `uses:` line in the workflows.
          refs=$(grep -rhoE 'uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}' .github/workflows \
            | sed -E 's/uses:[[:space:]]*//' | sort -u)
          if [ -z "$refs" ]; then
            echo "No pinned action references found."
            exit 0
          fi
          while IFS= read -r ref; do
            repo="${ref%@*}"
            sha="${ref##*@}"
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/commits/${sha}")
            if [ "$code" = "200" ]; then
              echo "OK   $ref"
            else
              echo "FAIL $ref (HTTP $code)"
              status=1
            fi
          done <<< "$refs"
          exit $status

  # Issue #538: the explorer has lint, build and Playwright smoke tests that
  # were never run in CI. Run them here so regressions (including XSS-relevant
  # rendering changes) fail before merge.
  explorer:
    name: Explorer (lint, build, smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Test (Playwright smoke)
        run: npm test

  # Validate Grafana dashboard metrics against metrics defined in Rust code
  dashboard-metrics:
    name: Dashboard Metrics Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Ensure all GitHub Actions in .github/workflows are pinned to full commit SHAs
      - name: Lint action SHA pinning
        run: |
          if grep -rnE 'uses: [^@]+@v[0-9]' .github/workflows; then
            echo "Error: Unpinned actions found in .github/workflows. Pin all actions to full 40-character SHAs."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-deny
      # Pinned to the 0.14 line: it still accepts the config keys in the
      # committed deny.toml (0.16 removed several of them). Bump this together
      # with a deny.toml migration, not on its own.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "^0.14" --locked
      # Advisories are blocking: a crate with a known RUSTSEC vulnerability now
      # fails the build, so a security patch in a transitive dependency is caught
      # here between the weekly Dependabot runs instead of sitting unnoticed.
      - name: Check advisories
        run: cargo deny check advisories
      # Licenses / bans / sources are gating: supply-chain and license
      # violations block the build to ensure policy is enforced.
      - name: Check licenses, bans, and sources
        run: cargo deny check licenses bans sources
