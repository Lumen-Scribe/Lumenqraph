name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Verify MSRV declared in Cargo.toml
  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: msrv
      - name: Build on MSRV
        run: cargo build --workspace --all-targets
      - name: Check on MSRV
        run: cargo check --workspace --all-targets

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
      # Read by the #[ignore]-marked tests to reach the service container; they
      # are run explicitly in the `--ignored` step below.
      TEST_DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Check sqlx metadata is up-to-date
        run: cargo sqlx prepare --database-url "$DATABASE_URL" --check
      - name: Test
        run: cargo test --workspace
      # The tests above skip anything marked #[ignore], which is every test that
      # needs a real database — retention pruning, contract-spec versioning, and
      # webhook enqueue all live there. Run them explicitly against the service
      # container above.
      #
      # Each test now provisions its own isolated Postgres schema (unique UUID
      # name), so they are safe to run in parallel and cannot corrupt each other
      # or any existing database.
      - name: Test (Postgres-backed)
        run: |
          cargo test -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo test -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo test -p lumenqraph-api      -- --ignored --test-threads=1
          cargo test -p lumenqraph-mcp      -- --ignored --test-threads=1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-api      -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-mcp      -- --ignored --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@a99c28d3f0da835de33ff2feb2e15691c7b9641f # v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Build (release)
        run: cargo build --workspace --release

  # Issue #222: OpenAPI spec drift check.
  # Generates the spec from utoipa annotations (via --print-openapi) and
  # compares it against the committed openapi.yaml.  Fails the build if any
  # path, method, or parameter name differs so that hand-edits to the YAML
  # can never silently diverge from the actual implementation.
  openapi-drift:
    name: OpenAPI Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: openapi-drift
      - name: Build lumenqraph-api
        run: cargo build -p lumenqraph-api
      - name: Generate OpenAPI spec from code
        # --print-openapi dumps the utoipa-derived spec as JSON and exits
        # without connecting to Postgres or binding a port.
        run: cargo run -p lumenqraph-api -- --print-openapi > /tmp/generated-openapi.json
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check for drift
        run: |
          python3 scripts/check_openapi_drift.py openapi.yaml /tmp/generated-openapi.json

  # TypeScript SDK: build, typecheck, lint, test, and codegen drift check
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Codegen drift check
        run: npm run codegen:check

  # Python SDK: lint, type-check, and test
  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Type-check (mypy)
        run: mypy lumenqraph
      - name: Test
        run: pytest -v

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - uses: rustsec/audit-check-action@6c8391537eae8e000a51e2e2eee5f4b58fda619b # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain-security:
    name: Supply Chain Security (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check supply chain
        run: cargo deny check
        continue-on-error: true
