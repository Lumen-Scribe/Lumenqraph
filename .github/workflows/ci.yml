name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

# Least-privilege permissions for build/test workflows
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
      # Read by the #[ignore]-marked tests to reach the service container; they
      # are run explicitly in the `--ignored` step below.
      TEST_DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # The tests above skip anything marked #[ignore], which is every test that
      # needs a real database — retention pruning, contract-spec versioning, and
      # webhook enqueue all live there. Run them explicitly against the service
      # container above.
      #
      # Each test now provisions its own isolated Postgres schema (unique UUID
      # name), so they are safe to run in parallel and cannot corrupt each other
      # or any existing database.
      - name: Test (Postgres-backed)
        run: |
          cargo test -p lumenqraph-indexer  -- --ignored
          cargo test -p lumenqraph-webhooks -- --ignored
          cargo test -p lumenqraph-api      -- --ignored
          cargo test -p lumenqraph-mcp      -- --ignored
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@6aca0e787c68cc6121f62949d85e52eedbc47ea6 # cargo-llvm-cov-0.6.15
      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p lumenqraph-indexer  -- --ignored
          cargo llvm-cov --no-report -p lumenqraph-webhooks -- --ignored
          cargo llvm-cov --no-report -p lumenqraph-api      -- --ignored
          cargo llvm-cov --no-report -p lumenqraph-mcp      -- --ignored
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@015f24e6818733317a2da2edd6290ab26238649a # v4.6.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@4b08f745e26e266e3e1496384f3e8c2f2f419c2f # v4.5.0
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Build (release)
        run: cargo build --workspace --release

  # TypeScript SDK: typecheck, test (#81 #82 #83), and codegen drift check (#82)
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Codegen drift check (#82)
        run: npm run codegen:check

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # For creating issues on vulnerabilities
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
      - uses: rustsec/audit-check-action@4e12d9db4a1f4e3b8e6f6e0b6e67c6e3f4d5e6f7 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain-security:
    name: Supply Chain Security (cargo-deny)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336a9b35a # stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check supply chain
        run: cargo deny check
        continue-on-error: true
