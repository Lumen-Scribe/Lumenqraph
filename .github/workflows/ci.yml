name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run security checks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verify MSRV declared in Cargo.toml
  msrv-check:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract MSRV from Cargo.toml
        id: msrv
        run: |
          MSRV=$(grep -m1 'rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$MSRV" >> $GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build on MSRV
        run: cargo build --workspace --all-targets
      - name: Check on MSRV
        run: cargo check --workspace --all-targets

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumenqraph
          POSTGRES_PASSWORD: lumenqraph
          POSTGRES_DB: lumenqraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumenqraph"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
      # Read by the #[ignore]-marked tests to reach the service container; they
      # are run explicitly in the `--ignored` step below.
      TEST_DATABASE_URL: postgres://lumenqraph:lumenqraph@localhost:5432/lumenqraph
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres
      - name: Check sqlx metadata is up-to-date
        run: cargo sqlx prepare --database-url "$DATABASE_URL" --check
      - name: Test
        run: cargo test --workspace
      # The tests above skip anything marked #[ignore], which is every test that
      # needs a real database — retention pruning, contract-spec versioning, and
      # webhook enqueue all live there. Run them explicitly against the service
      # container above.
      #
      # Each test now provisions its own isolated Postgres schema (unique UUID
      # name), so they are safe to run in parallel and cannot corrupt each other
      # or any existing database.
      - name: Test (Postgres-backed)
        run: |
          cargo test -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo test -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo test -p lumenqraph-api      -- --ignored --test-threads=1
          cargo test -p lumenqraph-mcp      -- --ignored --test-threads=1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov --no-report -p lumenqraph-indexer  -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-webhooks -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-api      -- --ignored --test-threads=1
          cargo llvm-cov --no-report -p lumenqraph-mcp      -- --ignored --test-threads=1
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Build (release)
        run: cargo build --workspace --release

  # TypeScript SDK: build, typecheck, lint, test, and codegen drift check
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Codegen drift check
        run: npm run codegen:check

  security-audit:
    name: Security Audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain-security:
    name: Supply Chain Security (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check supply chain
        run: cargo deny check
        continue-on-error: true
