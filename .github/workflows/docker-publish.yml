name: Docker – Build & Publish to GHCR

# Triggers:
#   • Every push of a semver tag (v*.*.*) — builds + publishes the image.
#   • Every pull_request touching the Dockerfile or this workflow — build only
#     (no push) so we catch breakage before merge.
on:
  push:
    tags:
      # Server releases are tagged `server-v*` so they are decoupled from the
      # SDK releases (`sdk-ts-v*`, `sdk-py-v*`). See CONTRIBUTING.md.
      - "server-v*.*.*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Image name follows the convention ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Required for provenance attestation (SLSA level 3)
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ── QEMU (needed for cross-compilation to arm64 on amd64 runners) ───────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      # ── Buildx (multi-platform builder) ─────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ── Authenticate to GHCR (skip on PRs — they have no write permission) ──
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute the real build timestamp ────────────────────────────────────
      # `github.event.repository.updated_at` is the time the repository
      # metadata last changed (e.g. a description edit), not the build time.
      # Use the current UTC time so /health.build_time is accurate.
      - name: Compute build time
        id: buildtime
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ── Derive tags + labels from Git metadata ───────────────────────────────
      # On a `server-v1.2.3` tag push this produces:
      #   ghcr.io/<owner>/<repo>:1.2.3
      #   ghcr.io/<owner>/<repo>:1.2
      #   ghcr.io/<owner>/<repo>:1
      #   ghcr.io/<owner>/<repo>:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Lumenqraph
            org.opencontainers.image.description=Soroban event-indexer with REST, GraphQL, SSE and MCP APIs
            org.opencontainers.image.vendor=Lumen-Scribe
            org.opencontainers.image.created=${{ steps.buildtime.outputs.time }}

      # ── Build (and push on tag events) ──────────────────────────────────────
      # Each platform leg pushes to a per-platform manifest and produces a
      # digest, which is collected in the merge job below.
      #
      # The cargo-chef dependency layer in the Dockerfile is cached via the
      # GitHub Actions cache (type=gha), scoped per platform so the amd64 and
      # arm64 dependency layers don't clobber each other. A source-only change
      # therefore reuses the cooked dependency layer and only rebuilds the
      # workspace crates.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Never push on PRs; push per-digest (not multi-arch manifest yet) on tags.
          outputs: >-
            ${{
              github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME)
            }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.time }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # ── Save digest for the merge job ────────────────────────────────────────
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-platform digests into a single multi-arch manifest ────────────
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Lumenqraph
            org.opencontainers.image.description=Soroban event-indexer with REST, GraphQL, SSE and MCP APIs
            org.opencontainers.image.vendor=Lumen-Scribe

      - name: Create and push multi-arch manifest
        id: push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

          # Resolve the digest of the manifest we just pushed so the
          # attestation step below has a subject to attest.
          digest="$(
            docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}" \
              --format '{{json .Manifest}}' | jq -r .digest
          )"
          if [ -z "$digest" ] || [ "$digest" = "null" ]; then
            echo "::error::Failed to resolve manifest digest for ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
            exit 1
          fi
          echo "Resolved manifest digest: $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # ── SLSA provenance attestation ─────────────────────────────────────────
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
