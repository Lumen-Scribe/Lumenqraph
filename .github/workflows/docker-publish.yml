name: Docker – Build & Publish to GHCR

# Triggers:
#   • Every push of a semver tag (v*.*.*) — builds + publishes the image.
#   • Every pull_request touching the Dockerfile or this workflow — build only
#     (no push) so we catch breakage before merge.
on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-publish.yml

env:
  REGISTRY: ghcr.io
  # Image name follows the convention ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push (${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for provenance attestation (SLSA level 3)
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── QEMU (needed for cross-compilation to arm64 on amd64 runners) ───────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ── Buildx (multi-platform builder) ─────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Authenticate to GHCR (skip on PRs — they have no write permission) ──
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive tags + labels from Git metadata ───────────────────────────────
      # On a tag push this produces:
      #   ghcr.io/<owner>/<repo>:v1.2.3
      #   ghcr.io/<owner>/<repo>:1.2.3
      #   ghcr.io/<owner>/<repo>:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Lumenqraph
            org.opencontainers.image.description=Soroban event-indexer with REST, GraphQL, WebSocket and MCP APIs
            org.opencontainers.image.vendor=Lumen-Scribe

      # ── Build (and push on tag events) ──────────────────────────────────────
      # Each platform leg pushes to a per-platform manifest and produces a
      # digest, which is collected in the merge job below.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Never push on PRs; push per-digest (not multi-arch manifest yet) on tags.
          outputs: >-
            ${{
              github.event_name == 'pull_request'
              && 'type=cacheonly'
              || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME)
            }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Save digest for the merge job ────────────────────────────────────────
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge per-platform digests into a single multi-arch manifest ────────────
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build-and-push
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download all digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Lumenqraph
            org.opencontainers.image.description=Soroban event-indexer with REST, GraphQL, WebSocket and MCP APIs
            org.opencontainers.image.vendor=Lumen-Scribe

      - name: Create and push multi-arch manifest
        id: push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect final image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # ── SLSA provenance attestation ─────────────────────────────────────────
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
