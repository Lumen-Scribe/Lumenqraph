name: SDK – Publish to npm

# Triggers on every semver tag that matches v*.*.*.
# The tag should be cut after the SDK version in package.json is bumped.
#
# Provenance:  --provenance requires id-token: write and publishes a signed
#              SLSA attestation alongside the tarball on the npm registry.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build & publish @lumenqraph/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance signing (OIDC token)
      id-token: write

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── Node setup — also configures the npm registry + auth token ───────────
      # Using actions/setup-node's registry-url wires NODE_AUTH_TOKEN into the
      # .npmrc that npm reads, so no manual .npmrc editing is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # ── Install (exact lockfile) ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Quality gates (same as CI — fail fast before touching the registry) ──
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Codegen drift check
        run: npm run codegen:check

      # ── Build ─────────────────────────────────────────────────────────────────
      # prepublishOnly also calls this, but running it explicitly makes the log
      # easier to audit and ensures dist/ is present before the publish step.
      - name: Build
        run: npm run build

      # ── Derive the correct dist-tag from the tag name ─────────────────────────
      # v1.2.3      → latest
      # v1.2.3-rc.1 → next   (pre-release versions)
      - name: Resolve dist-tag
        id: dist_tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ -[a-zA-Z] ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # ── Publish with provenance ───────────────────────────────────────────────
      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.dist_tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
