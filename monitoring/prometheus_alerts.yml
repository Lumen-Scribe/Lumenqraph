groups:
  - name: lumenqraph
    interval: 30s
    rules:
      - alert: LumenqraphIndexerLagHigh
        expr: "lumenqraph_indexer_lag_ledgers > 100"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer lag exceeds 100 ledgers."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexerlaghigh"

      - alert: LumenqraphIndexerLagCritical
        expr: "lumenqraph_indexer_lag_ledgers > 500"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Indexer lag exceeds 500 ledgers."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexerlagcritical"

      # Indexer stalled alert. Fires when nothing was ingested while lag exists,
      # OR when the cursor has not ADVANCED for 5+ minutes — a poller whose every
      # cycle fails keeps its heartbeat (`seconds_since_update`) fresh via counter
      # writes, but `seconds_since_progress` (progress_at) keeps growing (#756, #757).
      - alert: LumenqraphIndexerStalled
        expr: |
          (
            increase(lumenqraph_indexer_events_ingested_total[5m]) == 0
            and
            on(instance) lumenqraph_indexer_lag_ledgers > 0
          )
          or
          lumenqraph_indexer_seconds_since_progress > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lumenqraph indexer appears stalled"
          description: |
            No new events ingested in the last 5 minutes while lag exists, or the
            cursor has not advanced in 5+ minutes (seconds_since_progress).
            Indexer process may have crashed or be hanging — its /health endpoint
            returns 503 in this state (#756).
            Check indexer logs and process status immediately.

      - alert: LumenqraphIndexerErrorRateHigh
        expr: "rate(lumenqraph_indexer_errors_total[5m]) > 0.01"
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Indexer error rate exceeds 0.01 errors per second over five minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexererrorratehigh"

      - alert: LumenqraphLargeLagGrowth
        expr: "delta(lumenqraph_indexer_lag_ledgers[1h]) > 1000"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Indexer lag growth exceeds 1,000 ledgers over the last hour."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphlargelaggrowth"

      - alert: LumenqraphWebhookBacklogHigh
        expr: "lumenqraph_webhooks_oldest_pending_age_seconds > 300"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The oldest pending webhook delivery is more than five minutes old."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphwebhookbackloghigh"

      - alert: LumenqraphWebhookBacklogCritical
        expr: "lumenqraph_webhooks_oldest_pending_age_seconds > 3600"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The oldest pending webhook delivery is more than one hour old."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphwebhookbacklogcritical"

      - alert: LumenqraphUnrecoveredMissedRanges
        expr: "lumenqraph_indexer_open_missed_ranges > 0"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Indexer ledger gaps have remained unrecovered for 15 minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphunrecoveredmissedranges"

      - alert: LumenqraphUnrecoverableMissedRanges
        expr: "lumenqraph_indexer_permanent_missed_ranges > 0"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "At least one ledger gap is outside current RPC retention."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphunrecoverablemissedranges"

      - alert: LumenqraphRPCRetentionMarginLow
        expr: "(lumenqraph_indexer_last_processed_ledger - lumenqraph_indexer_rpc_oldest_ledger < 20) and lumenqraph_indexer_rpc_oldest_ledger > 0 and lumenqraph_indexer_last_processed_ledger > 0"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The indexer cursor is fewer than 20 ledgers ahead of the RPC retention floor, or already behind it."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphrpcretentionmarginlow"

      - alert: LumenqraphRPCFailovers
        expr: "increase(lumenqraph_indexer_rpc_failovers_total[10m]) > 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The indexer switched RPC providers in the last 10 minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphrpcfailovers"

      - alert: LumenqraphAuditDrops
        expr: "increase(lumenqraph_api_audit_dropped_total[5m]) > 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Audit records were dropped in the last five minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphauditdrops"

      - alert: LumenqraphRateLimitBackendErrors
        expr: "increase(lumenqraph_api_rate_limit_backend_errors_total[5m]) > 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The rate-limit backend returned errors in the last five minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphratelimitbackenderrors"

      - alert: LumenqraphSpecFetchFailures
        expr: "increase(lumenqraph_indexer_spec_fetch_failures_total[5m]) > 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Contract specification fetches failed in the last five minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphspecfetchfailures"

      - alert: LumenqraphTimestampParseErrors
        expr: "increase(lumenqraph_indexer_timestamp_parse_errors_total[5m]) > 0"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Indexer ledger timestamps failed to parse in the last five minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphtimestampparseerrors"

      - alert: LumenqraphConsecutiveErrors
        expr: "lumenqraph_indexer_consecutive_errors >= 20"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Consecutive poll failures reached the default circuit-breaker threshold of 20."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphconsecutiveerrors"

      - alert: LumenqraphSSEListenerDown
        expr: "lumenqraph_api_sse_listener_up == 0"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The API SSE listener has been down for two minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphsselistenerdown"

      - alert: LumenqraphEnrichmentRateLow
        expr: "lumenqraph_indexer_enrichment_rate < 0.5 and increase(lumenqraph_indexer_events_ingested_total[15m]) > 0"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fewer than half of events are enriched while the indexer is ingesting events."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphenrichmentratelow"

      - alert: LumenqraphAPIDown
        expr: 'up{job="lumenqraph-api"} == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lumenqraph API scrape target is down."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphapidown"

      - alert: LumenqraphIndexerDown
        expr: 'up{job="lumenqraph-indexer"} == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lumenqraph indexer scrape target is down."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexerdown"

      - alert: LumenqraphWebhooksDown
        expr: 'up{job="lumenqraph-webhooks"} == 0'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lumenqraph webhooks scrape target is down."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphwebhooksdown"

      - alert: LumenqraphIndexerMetricsAbsent
        expr: 'absent(lumenqraph_indexer_last_processed_ledger{job="lumenqraph-indexer"})'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Lumenqraph indexer metrics series is absent."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexermetricsabsent"

      - alert: LumenqraphIndexerHeartbeatStale
        expr: "lumenqraph_indexer_heartbeat_timestamp_seconds > 0 and (time() - lumenqraph_indexer_heartbeat_timestamp_seconds) > 240"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Indexer poll-loop heartbeat has not updated for more than 4 minutes."
          runbook_url: "https://github.com/Lumen-Scribe/Lumenqraph/blob/main/monitoring/README.md#lumenqraphindexerheartbeatstale"
