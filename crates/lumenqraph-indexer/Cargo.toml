[package]
name = "lumenqraph-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Opt-in gate for the heavy end-to-end smoke test in `src/smoke.rs`. It is
# also `#[ignore]`d, but the feature keeps the module out of a normal
# `cargo test` build entirely so it can never run in offline CI by accident.
# Run with: cargo test -p lumenqraph-indexer --features smoke-tests -- --ignored --test-threads=1
smoke-tests = []

[[bin]]
name = "lumenqraph-indexer"
path = "src/main.rs"

[dependencies]
lumenqraph-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
sqlx.workspace = true
reqwest.workspace = true
rand.workspace = true
stellar-xdr.workspace = true
hex.workspace = true
sha2.workspace = true
uuid.workspace = true
lru.workspace = true
axum.workspace = true
tower-http.workspace = true

[dev-dependencies]
hmac.workspace = true
sha2.workspace = true
reqwest.workspace = true
criterion.workspace = true
tokio.workspace = true

[[bench]]
name = "bench_indexer"
harness = false
