# Cargo deny configuration for supply-chain security scanning.
# The schema is version 2, supported by current cargo-deny releases.

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 OR MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    # Required by unicode-ident and the ICU/url/idna dependency chain.
    "Unicode-3.0",
    # Required by rustls through both supported webpki-roots releases.
    "CDLA-Permissive-2.0",
]
deny = ["GPL-2.0", "GPL-3.0", "AGPL-3.0"]

[bans]
multiple-versions = "warn"
deprecated = "warn"
unmaintained = "warn"
highest-ranking = false
wildcards = "allow"
# reqwest/rustls currently resolve two compatible webpki-roots lines. Keep the
# duplicate visible as a warning while allowing the security gate to pass until
# the upstream dependency graph converges.
skip = [
    { name = "webpki-roots" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
